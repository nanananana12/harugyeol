<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>하루결 · 오늘의 운세</title>
  <meta name="description" content="이름과 생년월일로 보는 오늘의 운세, 그리고 매일 업데이트되는 별자리 운세." />
  <meta property="og:title" content="하루결 · 오늘의 운세" />
  <meta property="og:description" content="가볍게 보는 오늘의 운세와 별자리 운세" />
  <meta name="theme-color" content="#f7f6f2" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🌙</text></svg>" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <header class="site-header">
    <div class="wrap header-inner">
      <a class="logo" href="./">하루결<span class="logo-dot">.</span></a>
      <p class="today" id="today-label"></p>
    </div>
  </header>

  <main class="wrap">
    <section class="hero">
      <h1>오늘 하루의 결을<br />가볍게 살펴보세요</h1>
      <p class="hero-sub">재미로 보는 운세예요. 좋은 말은 챙기고, 나머지는 가볍게 넘겨요.</p>
    </section>

    <nav class="tabs" role="tablist" aria-label="운세 종류">
      <button class="tab is-active" role="tab" id="tab-personal" aria-selected="true" aria-controls="panel-personal" data-tab="personal">오늘의 운세</button>
      <button class="tab" role="tab" id="tab-zodiac" aria-selected="false" aria-controls="panel-zodiac" data-tab="zodiac">별자리 운세</button>
    </nav>

    <!-- 오늘의 운세 -->
    <section class="panel" id="panel-personal" role="tabpanel" aria-labelledby="tab-personal">
      <form class="card form" id="fortune-form" autocomplete="off">
        <div class="field">
          <label for="name">이름</label>
          <input id="name" name="name" type="text" maxlength="20" placeholder="홍길동" required />
        </div>
        <div class="field">
          <label for="birth">생년월일 <span class="hint">양력</span></label>
          <input id="birth" name="birth" type="date" min="1900-01-01" required />
        </div>
        <div class="field">
          <label for="hour">태어난 시각 <span class="hint">선택</span></label>
          <select id="hour" name="hour">
            <option value="">모름</option>
            <option value="0">자시 (23:30 ~ 01:29)</option>
            <option value="1">축시 (01:30 ~ 03:29)</option>
            <option value="2">인시 (03:30 ~ 05:29)</option>
            <option value="3">묘시 (05:30 ~ 07:29)</option>
            <option value="4">진시 (07:30 ~ 09:29)</option>
            <option value="5">사시 (09:30 ~ 11:29)</option>
            <option value="6">오시 (11:30 ~ 13:29)</option>
            <option value="7">미시 (13:30 ~ 15:29)</option>
            <option value="8">신시 (15:30 ~ 17:29)</option>
            <option value="9">유시 (17:30 ~ 19:29)</option>
            <option value="10">술시 (19:30 ~ 21:29)</option>
            <option value="11">해시 (21:30 ~ 23:29)</option>
          </select>
        </div>
        <button class="btn-primary" type="submit">오늘의 운세 보기</button>
        <p class="privacy">입력한 정보는 서버로 전송되지 않고, 이 기기에서만 사용돼요.</p>
      </form>

      <div id="fortune-result" class="result" hidden></div>
    </section>

    <!-- 별자리 운세 -->
    <section class="panel" id="panel-zodiac" role="tabpanel" aria-labelledby="tab-zodiac" hidden>
      <div class="zodiac-head">
        <p class="zodiac-updated" id="zodiac-updated"></p>
      </div>
      <div class="zodiac-grid" id="zodiac-grid"></div>
    </section>
  </main>

  <footer class="site-footer">
    <div class="wrap">
      <p>운세는 재미로만 봐 주세요. 중요한 결정은 스스로 내려요.</p>
      <p class="muted">© 하루결</p>
    </div>
  </footer>

  <script src="data/zodiac.js"></script>
  <script src="js/fortune.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
